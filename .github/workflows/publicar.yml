# Publica la web en GitHub Pages cada vez que se sube un cambio a main
name: Publicar web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    environment:
      name: github-pages
      url: ${{ steps.intento1.outputs.page_url || steps.intento2.outputs.page_url || steps.despliegue.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      # A veces GitHub falla de forma pasajera al publicar: se reintenta solo, sin avisar
      - id: intento1
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.intento1.outcome == 'failure'
        run: sleep 60
      - id: intento2
        if: steps.intento1.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.intento2.outcome == 'failure'
        run: sleep 120
      - id: despliegue
        if: steps.intento2.outcome == 'failure'
        uses: actions/deploy-pages@v4
